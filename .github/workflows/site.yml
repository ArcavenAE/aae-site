name: Site

on:
  push:
    branches: [main]
  # No branch filter: a pull request stacked on another branch is built too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Both jobs block all outbound traffic except the hosts listed on their
# harden-runner step. Harden-runner always allows GitHub's own hosts as well
# (*.github.com, *.githubapp.com, ghcr.io, *.actions.githubusercontent.com,
# codeload.github.com, productionresultssa*.blob.core.windows.net for cache and
# artifact storage) and its own reporting hosts (agent.api.stepsecurity.io,
# prod.app-api.stepsecurity.io). The lists cannot remove those.

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      # cdn.jsdelivr.net: the pinned font and its license.
      # github.com: checkout and the link checker download.
      # registry.npmjs.org: npm ci.
      # release-assets.githubusercontent.com: where the link checker download redirects.
      # results-receiver.actions.githubusercontent.com: npm cache and artifact upload.
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            cdn.jsdelivr.net:443
            github.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Fetch the Montserrat 500 font (pinned URL, sha256 checked)
        env:
          # Source: the @fontsource/montserrat 5.2.5 package files on jsDelivr (the
          # font and its OFL license text), pinned by version.
          FONT_URL: https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.2.5/files/montserrat-latin-500-normal.woff2
          FONT_SHA256: '0aabcea59f54b9ea215b79f429c8a37e68b83fdf5488204e11b87aada8dde514'
          OFL_URL: https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.2.5/LICENSE
          OFL_SHA256: '18aabf190848725e2576eefb5c29ba06aac1029d02132252a7f312eac2e50cf3'
        run: |
          set -euo pipefail
          mkdir -p public/fonts
          curl --fail --silent --show-error --location --output public/fonts/montserrat-500.woff2 "$FONT_URL"
          curl --fail --silent --show-error --location --output public/fonts/OFL.txt "$OFL_URL"
          check() {
            got=$(sha256sum "$1" | cut -d' ' -f1)
            echo "sha256 $1 $got"
            [ -n "$2" ] || { echo "no sha256 pinned for $1" >&2; exit 1; }
            if [ "$2" != "$got" ]; then
              echo "sha256 mismatch for $1: want $2" >&2
              exit 1
            fi
          }
          check public/fonts/montserrat-500.woff2 "$FONT_SHA256"
          check public/fonts/OFL.txt "$OFL_SHA256"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Packed and uploaded straight after the install, before any dependency code
      # runs. tar keeps the .bin links and the executable bits that a plain
      # artifact upload drops.
      - name: Pack the installed tree for the deploy job
        run: tar -czf "$RUNNER_TEMP/tools.tar.gz" node_modules

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools
          path: ${{ runner.temp }}/tools.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Check the license text ships with the font
        run: test -s dist/fonts/OFL.txt && test -s dist/fonts/montserrat-500.woff2

      # Uploaded before the checks below, so their binaries run after the pages
      # are taken. A failed check still stops the deploy.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

      # The 404 page's canonical link names /404/, which is built as 404.html.
      - name: Link check (internal links)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --root-dir ${{ github.workspace }}/dist
            --remap 'https://docs.darkatelier.org file://${{ github.workspace }}/dist'
            --exclude '/404/$'
            'dist/**/*.html'
          fail: true

      # No token in this job: wrangler reads wrangler.jsonc and dist, then stops
      # before it would call Cloudflare.
      - name: Dry-run the deploy
        env:
          WRANGLER_HIDE_BANNER: 'true'
          # Overrides every other metrics setting; the file alone did not stop a call.
          WRANGLER_SEND_METRICS: 'false'
        run: ./node_modules/.bin/wrangler deploy --dry-run

  # Deploys only from main, and only while the repository variable CF_READY is
  # 'true'. No pull request run reaches this job or its secret.
  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CF_READY == 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      # api.cloudflare.com: wrangler's deploy and asset upload.
      # github.com: checkout. Artifact downloads use GitHub hosts that are always
      # allowed. No package registry: this job installs nothing.
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tools
          path: ${{ runner.temp }}/tools

      - name: Unpack the installed tree
        run: tar -xzf "$RUNNER_TEMP/tools/tools.tar.gz"

      # wrangler needs Node 22 or later and the runner's own Node varies by image.
      # Node 22, as in the build job, comes from the runner's tool cache, so no host
      # is added. A download would be blocked and stop the job before the deploy.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      # wranglerVersion equals the devDependency, so the action uses the unpacked
      # copy. Offline mode makes any attempt to fetch another one fail.
      - name: Deploy to production
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          npm_config_offline: 'true'
          WRANGLER_HIDE_BANNER: 'true'
          WRANGLER_SEND_METRICS: 'false'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
